name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit security scan
        run: bandit -r src/ -ll

      - name: Check for credential leaks
        run: |
          if git ls-files '*.env' '.env.*' | grep -q .; then
            echo "ERROR: .env files are tracked in git!"
            exit 1
          fi

      - name: Dependency audit
        run: |
          pip install -r requirements.txt
          pip-audit || true

  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///test.db
      MEM0_API_KEY: ""
      REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://localhost:6333
      LITELLM_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: install the private acp-sdk when the repo has a GH_READ_TOKEN secret
      # (a PAT with read access to mahi80/rbi). Without it the governance tests still
      # run — src/graph/governance.py is env-gated and tested with a fake SDK.
      - name: Install ACP governance SDK (if GH_READ_TOKEN is set)
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          if [ -n "$GH_READ_TOKEN" ]; then
            git config --global url."https://${GH_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            pip install -r requirements-governance.txt
            python -c "import acp; print('acp-sdk', acp.__version__)"
          else
            echo "GH_READ_TOKEN not set — skipping acp-sdk install"
          fi

      - name: Run tests
        run: pytest tests/ -v --tb=short -x

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds with the acp-sdk when GH_READ_TOKEN is configured, ungoverned otherwise
      # (the Dockerfile prints which). Set the secret to make CI prove the governed image.
      - name: Build Docker image
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          printf '%s' "$GH_READ_TOKEN" > /tmp/github_token
          DOCKER_BUILDKIT=1 docker build --secret id=github_token,src=/tmp/github_token -t loan-underwriting:test .
          rm -f /tmp/github_token

      - name: Verify image
        run: docker run --rm loan-underwriting:test python -c "from src.config import Settings; print('OK')"
